<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>403 Access Forbidden</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="text-center max-w-lg">
      <h1 class="text-7xl font-bold text-gray-700 mb-6">403</h1>
      <p class="text-2xl text-gray-600 mb-4">Access Forbidden</p>
      <div class="space-y-2">
        <p class="text-gray-500">You don't have permission to access this resource.</p>
        <p class="text-gray-400 text-sm">
          If you believe this was a mistake, please contact the administrator.
        </p>
      </div>
    </div>
  </body>
</html>
